name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      # The SPA is embedded into the binary via go:embed of web/frontend/dist,
      # which is gitignored — every Go build needs this output first.
      - name: Build SPA
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        if: ${{ !env.ACT }}
        with:
          name: frontend-dist
          path: web/frontend/dist
          if-no-files-found: error

  build:
    name: Build Binaries
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: s390x
          # Darwin
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/download-artifact@v8
        if: ${{ !env.ACT }}
        with:
          name: frontend-dist
          path: web/frontend/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          SUFFIX="${GOOS}-${GOARCH}"
          if [ -n "$GOARM" ]; then SUFFIX="${SUFFIX}v${GOARM}"; fi
          OUTPUT="OwlShack-${SUFFIX}${EXT}"
          CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/meshcore-go/OwlShack/internal/buildinfo.Version=${{ github.ref_name }}" -o "${OUTPUT}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{ !env.ACT }}
        with:
          name: OwlShack-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: OwlShack-*

  release:
    name: Create Release
    if: ${{ !github.event.act }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: OwlShack-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Mark SemVer pre-releases (tag contains a '-') as pre-releases so
          # they never show as "Latest release" or outrank the stable v1.x line.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*

  docker:
    name: Docker Image
    if: ${{ !github.event.act }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: OwlShack-linux-*
          path: docker/bin
          merge-multiple: false

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Only move :latest for stable tags. A SemVer pre-release (tag
            # contains a '-', e.g. v1.1.0-alpha.1) must not hijack :latest;
            # metadata-action already skips the major/minor tags for pre-releases.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8,linux/ppc64le,linux/riscv64,linux/s390x
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
