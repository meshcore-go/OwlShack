name: CI

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      # The SPA is embedded into the binary via go:embed of web/frontend/dist,
      # which is gitignored — the Go build fails without it. `npm run build`
      # also runs tsc, so this doubles as the frontend type check.
      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null .

      - name: Test
        run: go test -race -count=1 ./...
